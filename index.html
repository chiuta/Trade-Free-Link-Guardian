  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);

  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);

      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*

        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;

    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },

    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        if (!ok) return {keys: 0, cancelled: true};

        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:1.1rem}
p{margin:.4em 0}
a{color:var(--accent)}

.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-text);padding:8px 12px;border-radius:6px;z-index:10}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.25rem}
.ver{display:inline-block;margin-top:2px;font:.78rem var(--mono);color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
main{display:block;padding-top:16px;padding-bottom:24px}
.tf{background:var(--ok-bg);color:var(--ok);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:0 0 14px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card>h2{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.grid2>.card{margin-bottom:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.grid2>.card{margin-bottom:16px}}
label,.lbl{display:block;font-weight:600;margin-bottom:4px}
textarea,input[type=text],input[type=search],select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
textarea{font-family:var(--mono);font-size:.85rem;min-height:110px;resize:vertical}
::placeholder{color:var(--muted);opacity:1}
.btn{font:inherit;font-weight:600;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.drop{display:block;border:2px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;font-weight:500;margin:0}
.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.srcs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.srcs li{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.srcs .nm{min-width:0;overflow-wrap:anywhere}
#status{min-height:1.4em;margin:0 0 10px;font-weight:600}
#status.err{color:var(--err);background:var(--err-bg);border-radius:8px;padding:8px 12px}
#status.ok{color:var(--ok)}
.scorebox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;font-weight:600;color:var(--muted)}
.bar-track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden;width:100%;max-width:260px}
.bar-fill{height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0 0}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat dt{font-size:.78rem;color:var(--muted);font-weight:600}
.stat dd{margin:0;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.filters label{font-size:.85rem}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{border:1px solid var(--border);border-left:5px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg)}
.row.s-error{border-left-color:var(--err)}.row.s-warn{border-left-color:var(--warn)}.row.s-info{border-left-color:var(--info)}.row.s-ok{border-left-color:var(--ok)}
.url{display:block;font:.9rem var(--mono);overflow-wrap:anywhere;word-break:break-all}
.meta{color:var(--muted);font-size:.82rem;margin:3px 0 6px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:600;border:1px solid transparent}
.b-error{background:var(--err-bg);color:var(--err)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-cls{background:var(--surface2);color:var(--text);border-color:var(--border)}
.fix{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-top:1px dashed var(--border);padding-top:6px;margin-top:6px}
.fix .fl{font-weight:600;font-size:.85rem}
.fix code{overflow-wrap:anywhere;word-break:break-all;flex:1 1 220px}
.fix .fa{display:flex;gap:6px}
.links{display:flex;gap:12px;margin-top:6px;font-size:.85rem}
.more{text-align:center;margin-top:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
td select{padding:4px 6px;min-width:110px}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.logl li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--bg)}
.logl code{overflow-wrap:anywhere;word-break:break-all;flex:1 1 240px}
.empty{color:var(--muted);padding:8px 0}
.about p{max-width:80ch}
footer{border-top:1px solid var(--border);background:var(--surface);padding:16px 0;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.print-only{display:none}
@media (max-width:480px){
  .score{font-size:2.4rem}
  .card{padding:12px}
  .btn{padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--border:#999}
  body{background:#fff;color:#000;font-size:11pt}
  .app-ui,header.top,footer,#status,.skip{display:none!important}
  .print-only{display:block!important}
  #report h1{font-size:18pt;margin-bottom:6pt}
  #report h2{font-size:13pt;margin:14pt 0 4pt}
  #report table{font-size:9pt;page-break-inside:auto}
  #report tr{page-break-inside:avoid}
  #report th,#report td{border:1px solid #999;color:#000}
  a{color:#000}
}

  $('reanBtn').addEventListener('click', function () {
    S.sources.forEach(function (s) { var r = buildFixedText(s); s.text = r.text; s.bytes = utf8Len(r.text); });
    S.acc = {}; S.ign = {}; S.log = [];
    rebuild(); renderAll(); say('out.reanok', null, 'ok');
  });
  $('csvBtn').addEventListener('click', function () { download('tflg-links-' + stamp() + '.csv', 'text/csv', buildCsv()); });
  $('jsonBtn').addEventListener('click', function () { download('tflg-links-' + stamp() + '.json', 'application/json', buildJson()); });
  $('printBtn').addEventListener('click', function () { buildReport(); window.print(); });
  window.addEventListener('beforeprint', buildReport);
}

bind();
rebuild();
renderAll();
})();
