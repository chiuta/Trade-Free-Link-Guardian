<style>
:root{
  --bg:#f4f6f9;--surface:#ffffff;--surface2:#eceff5;--text:#18202c;--muted:#465163;--border:#c3ccd9;
  --accent:#0b5cad;--accent-text:#ffffff;--accent-soft:#e3eefb;
  --err-bg:#fde8e8;--err:#8a1111;--warn-bg:#fff1cc;--warn:#6b4500;--info-bg:#e3eefb;--info:#0b3f7a;--ok-bg:#dff5e5;--ok:#0d5a2a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a;--surface:#161d27;--surface2:#1f2835;--text:#e8edf4;--muted:#b0bac9;--border:#344154;
    --accent:#7bbcff;--accent-text:#04213f;--accent-soft:#16304d;
    --err-bg:#4a1818;--err:#ffc7c7;--warn-bg:#473400;--warn:#ffe0a0;--info-bg:#15324f;--info:#c3e0ff;--ok-bg:#12402a;--ok:#bdf2cf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a;--surface:#161d27;--surface2:#1f2835;--text:#e8edf4;--muted:#b0bac9;--border:#344154;
  --accent:#7bbcff;--accent-text:#04213f;--accent-soft:#16304d;
  --err-bg:#4a1818;--err:#ffc7c7;--warn-bg:#473400;--warn:#ffe0a0;--info-bg:#15324f;--info:#c3e0ff;--ok-bg:#12402a;--ok:#bdf2cf;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:1.1rem}
p{margin:.4em 0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-text);padding:8px 12px;border-radius:6px;z-index:10}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.25rem}
.ver{display:inline-block;margin-top:2px;font:.78rem var(--mono);color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
main{display:block;padding-top:16px;padding-bottom:24px}
.tf{background:var(--ok-bg);color:var(--ok);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:0 0 14px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card>h2{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.grid2>.card{margin-bottom:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.grid2>.card{margin-bottom:16px}}
label,.lbl{display:block;font-weight:600;margin-bottom:4px}
textarea,input[type=text],input[type=search],select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
textarea{font-family:var(--mono);font-size:.85rem;min-height:110px;resize:vertical}
::placeholder{color:var(--muted);opacity:1}
.btn{font:inherit;font-weight:600;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.drop{display:block;border:2px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;font-weight:500;margin:0}
.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.srcs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.srcs li{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.srcs .nm{min-width:0;overflow-wrap:anywhere}
#status{min-height:1.4em;margin:0 0 10px;font-weight:600}
#status.err{color:var(--err);background:var(--err-bg);border-radius:8px;padding:8px 12px}
#status.ok{color:var(--ok)}
.scorebox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;font-weight:600;color:var(--muted)}
.bar-track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden;width:100%;max-width:260px}
.bar-fill{height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0 0}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat dt{font-size:.78rem;color:var(--muted);font-weight:600}
.stat dd{margin:0;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.filters label{font-size:.85rem}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{border:1px solid var(--border);border-left:5px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg)}
.row.s-error{border-left-color:var(--err)}.row.s-warn{border-left-color:var(--warn)}.row.s-info{border-left-color:var(--info)}.row.s-ok{border-left-color:var(--ok)}
.url{display:block;font:.9rem var(--mono);overflow-wrap:anywhere;word-break:break-all}
.meta{color:var(--muted);font-size:.82rem;margin:3px 0 6px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:600;border:1px solid transparent}
.b-error{background:var(--err-bg);color:var(--err)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-cls{background:var(--surface2);color:var(--text);border-color:var(--border)}
.fix{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-top:1px dashed var(--border);padding-top:6px;margin-top:6px}
.fix .fl{font-weight:600;font-size:.85rem}
.fix code{overflow-wrap:anywhere;word-break:break-all;flex:1 1 220px}
.fix .fa{display:flex;gap:6px}
.links{display:flex;gap:12px;margin-top:6px;font-size:.85rem}
.more{text-align:center;margin-top:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
td select{padding:4px 6px;min-width:110px}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.logl li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--bg)}
.logl code{overflow-wrap:anywhere;word-break:break-all;flex:1 1 240px}
.empty{color:var(--muted);padding:8px 0}
.about p{max-width:80ch}
footer{border-top:1px solid var(--border);background:var(--surface);padding:16px 0;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.print-only{display:none}
@media (max-width:480px){
  .score{font-size:2.4rem}
  .card{padding:12px}
  .btn{padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--border:#999}
  body{background:#fff;color:#000;font-size:11pt}
  .app-ui,header.top,footer,#status,.skip{display:none!important}
  .print-only{display:block!important}
  #report h1{font-size:18pt;margin-bottom:6pt}
  #report h2{font-size:13pt;margin:14pt 0 4pt}
  #report table{font-size:9pt;page-break-inside:auto}
  #report tr{page-break-inside:avoid}
  #report th,#report td{border:1px solid #999;color:#000}
  a{color:#000}
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 32 32" role="img" aria-label="Trade-Free Link Guardian"><rect width="32" height="32" rx="7" fill="#0b5cad"/><path d="M16 5l9 3.5v7c0 5.5-3.8 9.6-9 11.5-5.2-1.9-9-6-9-11.5v-7z" fill="none" stroke="#fff" stroke-width="2"/><path d="M11.5 16.2l3.2 3.2 6-6.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Trade-Free Link Guardian</h1><span class="ver">v1.33.4-web</span></div>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="langBtn"></button>
      <button type="button" class="btn" id="themeBtn"></button>
    </div>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1">
  <p class="tf" data-i18n="tradefree"></p>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="app-ui">
  <div class="grid2">
    <section class="card" aria-labelledby="inH">
      <h2 id="inH" data-i18n="in.h"></h2>
      <label for="paste" data-i18n="in.paste"></label>
      <textarea id="paste" spellcheck="false" data-i18n-ph="in.ph"></textarea>
      <div class="btns">
        <button type="button" class="btn primary" id="addBtn" data-i18n="in.add"></button>
        <button type="button" class="btn" id="demoBtn" data-i18n="in.demo"></button>
        <button type="button" class="btn" id="clearBtn" data-i18n="in.clear"></button>
      </div>
      <p class="muted small" data-i18n="in.keys"></p>
      <label class="drop" id="drop" for="files"><span data-i18n="in.drop"></span><input type="file" id="files" multiple accept=".html,.htm,.xhtml,.xml,.md,.markdown,.txt,.csv,text/*"></label>
      <div class="opts">
        <label class="chk" for="optImg"><input type="checkbox" id="optImg"><span data-i18n="in.img"></span></label>
        <div><label for="site" data-i18n="in.site"></label><input type="text" id="site" autocomplete="off" spellcheck="false" data-i18n-ph="in.siteph"><span class="muted small" data-i18n="in.sitehint"></span></div>
      </div>
      <ul class="srcs" id="srcList" aria-label="Sources"></ul>
    </section>
    <section class="card" aria-labelledby="sumH">
      <h2 id="sumH" data-i18n="sum.h"></h2>
      <div id="sumBody"></div>
    </section>
  </div>

  <section class="card" id="resCard" aria-labelledby="resH" hidden style="margin-top:16px">
    <h2 id="resH" data-i18n="res.h"></h2>
    <div class="filters">
      <div><label for="fQ" data-i18n="f.q"></label><input type="search" id="fQ" autocomplete="off"></div>
      <div><label for="fSev" data-i18n="f.sev"></label><select id="fSev"></select></div>
      <div><label for="fCode" data-i18n="f.code"></label><select id="fCode"></select></div>
      <div><label for="fCls" data-i18n="f.cls"></label><select id="fCls"></select></div>
      <div><label for="fFix" data-i18n="f.fix"></label><select id="fFix"></select></div>
    </div>
    <div class="btns">
      <label for="bulkType" class="sr-only" data-i18n="bulk.type"></label>
      <select id="bulkType" style="width:auto;max-width:100%"></select>
      <button type="button" class="btn primary" id="bulkBtn" data-i18n="bulk.go"></button>
      <span class="muted small" id="resCount" role="status"></span>
    </div>
    <ul class="rows" id="rows"></ul>
    <div class="more"><button type="button" class="btn" id="moreBtn" hidden></button></div>
  </section>

  <section class="card" id="domCard" aria-labelledby="domH" hidden>
    <h2 id="domH" data-i18n="dom.h"></h2>
    <p class="muted small" data-i18n="dom.hint"></p>
    <div class="tw"><table><caption class="sr-only" data-i18n="dom.h"></caption><thead id="domHead"></thead><tbody id="domBody"></tbody></table></div>
  </section>

  <section class="card" id="logCard" aria-labelledby="logH" hidden>
    <h2 id="logH" data-i18n="log.h"></h2>
    <div class="btns">
      <button type="button" class="btn" id="undoLast" data-i18n="log.last"></button>
      <button type="button" class="btn" id="undoAll" data-i18n="log.all"></button>
    </div>
    <ol class="logl" id="logList"></ol>
    <p class="empty" id="logEmpty" data-i18n="log.none"></p>
  </section>

  <section class="card" id="outCard" aria-labelledby="outH" hidden>
    <h2 id="outH" data-i18n="out.h"></h2>
    <p class="muted small" data-i18n="out.hint"></p>
    <div id="outSelBox"><label for="outSel" data-i18n="out.sel"></label><select id="outSel"></select></div>
    <p class="small" id="outInfo" role="status"></p>
    <label for="outTa" class="sr-only" data-i18n="out.ta"></label>
    <textarea id="outTa" readonly spellcheck="false" style="min-height:180px"></textarea>
    <div class="btns">
      <button type="button" class="btn primary" id="dlBtn" data-i18n="out.dl"></button>
      <button type="button" class="btn" id="copyBtn" data-i18n="out.copy"></button>
      <button type="button" class="btn" id="reanBtn" data-i18n="out.rean"></button>
    </div>
  </section>

  <section class="card" id="expCard" aria-labelledby="expH" hidden>
    <h2 id="expH" data-i18n="exp.h"></h2>
    <p class="muted small" data-i18n="exp.hint"></p>
    <div class="btns">
      <button type="button" class="btn" id="csvBtn" data-i18n="exp.csv"></button>
      <button type="button" class="btn" id="jsonBtn" data-i18n="exp.json"></button>
      <button type="button" class="btn" id="printBtn" data-i18n="exp.print"></button>
    </div>
  </section>

  <section class="card about" id="about" aria-labelledby="abH">
    <h2 id="abH" data-i18n="ab.h"></h2>
    <p data-i18n="ab.p1"></p>
    <p data-i18n="ab.p2"></p>
    <p data-i18n="ab.p3"></p>
  </section>
  </div>
  <div id="report" class="print-only"></div>
</main>
<footer>
  <div class="wrap">
    <span><span data-i18n="ft.lic"></span> GPL-2.0-or-later</span>
    <span><a href="https://github.com/chiuta/trade-free-link-guardian" rel="noopener noreferrer" target="_blank">github.com/chiuta/trade-free-link-guardian</a></span>
    <span data-i18n="ft.tf"></span>
  </div>
</footer>

        suggested_fixes: r.fixes.map(function (f) { return {type: f.type, to: f.to}; }), accepted_fixes: accTypes(r)};
    }),
    fix_log: S.log.map(function (e) { return {n: e.n, action: e.action, fix: e.type, before: e.before, after: e.after}; })
  }, null, 2);
}
function stamp() { var d = new Date(); return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }

function buildReport() {
  var rp = $('report'); clear(rp);
  if (!S.base || !S.base.arr.length) return;
  var sm = S.base.sum;
  function table(heads, rows) {
    return h('table', null, h('thead', null, h('tr', null, heads.map(function (x) { return h('th', {scope: 'col', text: x}); }))),
      h('tbody', null, rows.map(function (r) { return h('tr', null, r.map(function (c) { return h('td', {text: String(c)}); })); })));
  }
  rp.append(h('h1', {text: t('rep.h')}),
    h('p', {text: t('rep.gen') + ': ' + new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC / ' + t('rep.tool') + ': Trade-Free Link Guardian ' + VERSION + ' (GPL-2.0-or-later)'}),
    h('p', {text: t('rep.note')}),
    h('h2', {text: t('rep.sources')}),
    table([t('in.h'), 'type', t('st.links')], S.sources.map(function (s) { return [s.name, s.kind, s.links]; })),
    h('h2', {text: t('rep.sum')}),
    table(['', ''], [[t('score'), sm.score + ' / 100'], [t('rep.after'), S.cur.sum.score + ' / 100'], [t('st.links'), sm.n], [t('st.internal'), sm.cls.internal || 0], [t('st.external'), sm.cls.external || 0], [t('st.mail'), (sm.cls.mailto || 0) + (sm.cls.tel || 0)],
      [t('st.domains'), sm.domains], [t('st.err'), sm.sev.error], [t('st.warn'), sm.sev.warn], [t('st.info'), sm.sev.info], [t('st.acc'), accCount()]]),
    h('h2', {text: t('rep.issues')}),
    table([t('f.code'), t('rep.sev'), t('rep.cnt')], Object.keys(sm.codes).sort().map(function (c) { return [issueText({code: c, x: '…'}).replace(/\s*…$/, ''), t('sev.' + SEV[c]), sm.codes[c]]; })));
  var doms = Array.from(S.base.doms.values()).sort(function (a, b) { return b.count - a.count; }).slice(0, 40);
  rp.append(h('h2', {text: t('rep.domains')}),
    table([t('dom.host'), t('dom.n'), t('dom.www'), t('dom.http'), t('dom.iss')], doms.map(function (d) { return [d.key, d.count, d.www + ' / ' + d.bareN, d.http + ' / ' + d.https, d.issueN]; })));
  var bad = S.base.arr.filter(function (r) { return r.issues.length; }), CAP = 300;
  rp.append(h('h2', {text: t('rep.top') + ' (' + bad.length + ')'}),
    bad.length > CAP ? h('p', {text: t('rep.capped', {n: CAP})}) : null,
    table([t('rep.url'), t('rep.where'), t('f.code')], bad.slice(0, CAP).map(function (r) { return [r.it.url || '(empty)', r.it.srcName + ':' + r.it.line, rowIssues(r).join('; ')]; })));
  if (S.log.length) rp.append(h('h2', {text: t('rep.log')}), table(['#', '', t('rep.url')], S.log.map(function (e) { return [e.n, t('fix.' + e.type), e.action === 'accept' ? e.before + ' -> ' + e.after : t('log.ign') + ': ' + e.before]; })));
}

/* ---------- events ---------- */
function bind() {
  $('addBtn').addEventListener('click', addPasted);
  $('paste').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addPasted(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    var a = document.activeElement, tg = a && a.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || (a && a.isContentEditable)) return;
    var q = $('fQ'); if (q && q.offsetParent !== null) { e.preventDefault(); q.focus(); q.select(); }
  });
  $('demoBtn').addEventListener('click', loadDemo);
  $('clearBtn').addEventListener('click', clearAll);
  $('files').addEventListener('change', function (e) { addFiles(e.target.files).then(function () { e.target.value = ''; }); });
  var drop = $('drop');
  window.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  window.addEventListener('dragleave', function (e) { if (!e.relatedTarget) drop.classList.remove('over'); });
  window.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  $('optImg').addEventListener('change', function (e) { S.opts.images = e.target.checked; rebuild(); renderAll(); });
  var siteT = null;
  $('site').addEventListener('input', function (e) { S.opts.site = e.target.value; clearTimeout(siteT); siteT = setTimeout(function () { rebuild(); renderAll(); }, 250); });
  $('langBtn').addEventListener('click', function () { S.lang = S.lang === 'ro' ? 'en' : 'ro'; renderAll(); });
  $('themeBtn').addEventListener('click', function () { S.theme = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', S.theme); applyStatic(); });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function () { if (!S.theme) applyStatic(); });
  }
  [['fQ', 'q', 'input'], ['fSev', 'sev', 'change'], ['fCode', 'code', 'change'], ['fCls', 'cls', 'change'], ['fFix', 'fix', 'change']].forEach(function (x) {
    $(x[0]).addEventListener(x[2], function (e) { S.f[x[1]] = e.target.value; S.shown = 200; renderRows(); });
  });
  $('bulkType').addEventListener('change', function (e) { S.f.bulk = e.target.value; });
  $('bulkBtn').addEventListener('click', function () {
    var batch = ++S.batchN, n = 0, type = S.f.bulk;
    filtered().forEach(function (r) { pendingFixes(r).forEach(function (f) { if (!type || f.type === type) { doAccept(r, f.type, batch); n++; } }); });
    S.fk = 'bulk';
    afterChange(); $('bulkBtn').focus();
    say(n ? 'bulk.done' : 'bulk.none', {n: n}, n ? 'ok' : '');
  });
  $('moreBtn').addEventListener('click', function () { S.shown += 200; renderRows(); });
  $('undoLast').addEventListener('click', function () {
    if (!S.log.length) return;
    var b = S.log[S.log.length - 1].batch;
    S.log.filter(function (e) { return e.batch === b; }).reverse().forEach(undoEntry);
    afterChange();
  });
  $('undoAll').addEventListener('click', function () { S.acc = {}; S.ign = {}; S.log = []; afterChange(); });
  $('outSel').addEventListener('change', function (e) { S.outSrc = e.target.value; renderOutput(); });
  $('dlBtn').addEventListener('click', function () {
    var src = S.sources.filter(function (s) { return s.id === S.outSrc; })[0]; if (!src) return;
    var res = buildFixedText(src), mime = {html: 'text/html', md: 'text/markdown', csv: 'text/csv', txt: 'text/plain', wxr: 'application/xml', sitemap: 'application/xml'}[src.kind] || 'text/plain';
    var name = /\.[^.\/]+$/.test(src.name) ? src.name.replace(/(\.[^.\/]+)$/, '.fixed$1') : src.name + '.fixed.txt';
    download(name, mime, res.text);
  });
  $('copyBtn').addEventListener('click', function () {
    var src = S.sources.filter(function (s) { return s.id === S.outSrc; })[0]; if (!src) return;
    var txt = buildFixedText(src).text;
    var done = function () { say('out.copied', null, 'ok'); }, fail = function () { $('outTa').select(); say('out.copyfail', null, 'err'); };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); }
  });
  $('reanBtn').addEventListener('click', function () {
    S.sources.forEach(function (s) { var r = buildFixedText(s); s.text = r.text; s.bytes = utf8Len(r.text); });
    S.acc = {}; S.ign = {}; S.log = [];
    rebuild(); renderAll(); say('out.reanok', null, 'ok');
  });
  $('csvBtn').addEventListener('click', function () { download('tflg-links-' + stamp() + '.csv', 'text/csv', buildCsv()); });
  $('jsonBtn').addEventListener('click', function () { download('tflg-links-' + stamp() + '.json', 'application/json', buildJson()); });
  $('printBtn').addEventListener('click', function () { buildReport(); window.print(); });
  window.addEventListener('beforeprint', buildReport);
}

bind();
rebuild();
renderAll();
})();
</script>
